kind = "web"
previewPath = "/"
title = "OLYM – Luxury Skincare"
version = "1.0.0"
id = "artifacts/olym"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18129

[services.development]
run = "pnpm --filter @workspace/olym run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/olym", "run", "build" ]
publicDir = "artifacts/olym/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18129"
BASE_PATH = "/"
